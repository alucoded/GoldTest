<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Card Game</title>
    <style>
        /* Basic styling for visualization */
        .drop-zone { width: 100px; height: 140px; border: 2px dashed #ccc; margin: 10px; display: inline-block; }
        .card { width: 90px; height: 130px; background: #eee; border: 1px solid #333; cursor: grab; padding: 5px; }
        .hidden { display: none !important; }
        .admin-panel { border: 2px solid red; padding: 15px; margin-top: 20px; background: #fee; }
    </style>
</head>
<body>

    <!-- USER PROFILE SECTION -->
    <div id="user-profile">
        <!-- Default avatar until Google Auth loads -->
        <img id="player-pfp" src="assets/default-avatar.png" alt="Profile" style="width: 50px; height: 50px; border-radius: 50%;">
        <span id="player-name">Loading...</span>
        <span id="player-rank">Rank: Bronze</span>
    </div>

    <!-- LOBBY SECTION -->
    <div id="lobby-container">
        <h2 id="lobby-title">Lobby</h2>
        
        <!-- Button starts disabled so users cannot force a ghost match -->
        <button id="match-status-btn" disabled>Waiting for opponent...</button>
    </div>

    <!-- GAME BOARD SECTION -->
    <div id="game-board">
        <h3>Act Slots</h3>
        <!-- data-slot-type is strictly checked in the drag-and-drop logic -->
        <div class="drop-zone act-slot" ondragover="onDragOver(event)" ondrop="onCardDrop(event)" data-slot-type="ActSlot"></div>
        <div class="drop-zone act-slot" ondragover="onDragOver(event)" ondrop="onCardDrop(event)" data-slot-type="ActSlot"></div>
        
        <h3>Graveyard</h3>
        <div class="drop-zone graveyard" ondragover="onDragOver(event)" ondrop="onCardDrop(event)" data-slot-type="Graveyard"></div>

        <h3>Your Hand</h3>
        <div class="drop-zone hand" data-slot-type="Hand">
            <!-- Example Act Card -->
            <div class="card" draggable="true" ondragstart="onCardDragStart(event)" id="card-1" data-type="Act" data-current-slot="Hand">
                Vital Strike (Act)
            </div>
        </div>
    </div>

    <!-- ADMIN TOOLS SECTION -->
    <div id="admin-panel" class="admin-panel hidden">
        <h3 style="color: red; margin-top: 0;">Admin Debug Tools</h3>
        
        <label>Target User ID:</label>
        <input type="text" id="admin-target-uid" placeholder="Enter User UID">
        
        <div style="margin-top: 10px;">
            <input type="number" id="admin-gold-amount" placeholder="Gold Amount">
            <button onclick="adminSetGold()">Set Gold</button>
        </div>
        
        <div style="margin-top: 10px;">
            <input type="text" id="admin-item-id" placeholder="Item ID to Delete">
            <button onclick="adminDeleteUnlock()">Delete Unlock</button>
        </div>
    </div>

    <!-- Your Firebase and script tags would go here -->
    <script src="client.js"></script>
</body>
</html>
